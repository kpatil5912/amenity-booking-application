services:
  postgres:
    image: postgres:16-alpine
    container_name: amenityhub-postgres
    environment:
      POSTGRES_DB: amenityhub
      POSTGRES_USER: amenityhub
      POSTGRES_PASSWORD: amenityhub
    ports:
      - "5433:5432"
    volumes:
      - amenityhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amenityhub -d amenityhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP capture for testing email notifications (UI at http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: amenityhub-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  amenityhub_pgdata:
