<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>You got a spot!</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
    <h2>Good news — a spot opened up</h2>
    <p>Hi <span th:text="${fullName}">Resident</span>,</p>
    <p>A spot opened up and you have been moved off the waitlist. Your booking
       for <strong th:text="${resourceName}">Resource</strong> is now confirmed.</p>
    <table cellpadding="6" style="border-collapse: collapse;">
        <tr><td><strong>Reference</strong></td><td th:text="${bookingReference}">AMN-XXXX</td></tr>
        <tr><td><strong>Starts</strong></td><td th:text="${startTime}">start</td></tr>
        <tr><td><strong>Ends</strong></td><td th:text="${endTime}">end</td></tr>
    </table>
    <p style="color:#888; font-size: 12px;">AmenityHub</p>
</body>
</html>
